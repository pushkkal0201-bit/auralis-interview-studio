name: Auralis Cracked integration

on:
  push:
    branches: [feature/cracked-skill-suite]
  pull_request:
    paths:
      - "auralis/app/cracked_*.py"
      - "auralis/app/static/cracked.*"
      - "auralis/vendor/cracked/**"
      - "auralis/tests/test_cracked_suite.py"
      - ".github/workflows/cracked-integration.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Auralis test dependencies
        run: python -m pip install -r auralis/requirements.txt
      - name: Check browser script syntax
        run: node --check auralis/app/static/cracked.js
      - name: Verify all 19 skill files and model adapter
        run: python -m pytest tests/test_cracked_suite.py -q
        working-directory: auralis
      - name: Verify opt-in Auralis app routes
        run: |
          cd auralis
          python - <<'PY'
          from app.cracked_entry import app
          paths={getattr(route,'path',None) for route in app.routes}
          assert {'/cracked','/api/cracked/features','/api/cracked/coach'} <= paths
          print('Cracked API and interface registered')
          PY
